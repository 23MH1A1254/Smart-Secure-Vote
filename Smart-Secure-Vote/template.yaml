AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Smart Secure Vote - serverless API (API Gateway HTTP API + Lambda container + KMS + Secrets Manager + SNS)

Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: PostgreSQL URL reachable from Lambda, e.g. postgresql+psycopg2://user:password@host:5432/dbname
  AdminUsername:
    Type: String
    Default: admin
  AdminPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Password for the first admin account (created on first cold start if no admin exists)
  CorsOrigins:
    Type: String
    Default: http://localhost:5173
    Description: Comma separated list of frontend origins allowed to call the API
  SmsProvider:
    Type: String
    Default: sns
    AllowedValues: [sns, mock]
  SmsSenderId:
    Type: String
    Default: SMARTVOTE

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024

Resources:
  # KMS customer-managed key: encrypts the Lambda environment variables and the JWT secret.
  AppKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Smart Secure Vote application key
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

  AppKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-key"
      TargetKeyId: !Ref AppKey

  # JWT signing secret: generated by AWS, never present in source code or the template.
  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: JWT signing secret for Smart Secure Vote
      KmsKeyId: !Ref AppKey
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:      # API Gateway throttling = first line of defence against floods
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile.lambda
      DockerContext: ./backend
      DockerTag: v1
    Properties:
      PackageType: Image
      KmsKeyArn: !GetAtt AppKey.Arn
      Environment:
        Variables:
          APP_ENV: production
          DATABASE_URL: !Ref DatabaseUrl
          JWT_SECRET_ARN: !Ref JwtSecret
          ADMIN_USERNAME: !Ref AdminUsername
          ADMIN_PASSWORD: !Ref AdminPassword
          SMS_PROVIDER: !Ref SmsProvider
          SMS_SENDER_ID: !Ref SmsSenderId
          CORS_ORIGINS: !Ref CorsOrigins
      Policies:                  # least-privilege IAM role for the function
        - Statement:
            - Sid: SendSms
              Effect: Allow
              Action: sns:Publish
              Resource: "*"      # SNS only allows "*" when publishing directly to phone numbers
            - Sid: ReadJwtSecret
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecret
            - Sid: UseAppKey
              Effect: Allow
              Action: [kms:Decrypt, kms:DescribeKey]
              Resource: !GetAtt AppKey.Arn
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: Base URL of the API (use as VITE_API_URL when building the frontend)
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  KmsKeyArn:
    Value: !GetAtt AppKey.Arn
