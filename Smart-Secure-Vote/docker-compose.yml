# Run everything:  docker compose up --build      (then open http://localhost:8080)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ssv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-smartsecurevote}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ssv} -d ${POSTGRES_DB:-smartsecurevote}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ssv}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smartsecurevote}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      EXPOSE_DEMO_OTP: ${EXPOSE_DEMO_OTP:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      TRUST_PROXY: "true"   # real client IP comes from the nginx container in front
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
